<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="coronaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E1B"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#E03E00"/>
    </linearGradient>
    <filter id="coronaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded plate -->
  <rect width="64" height="64" rx="14" fill="#141721" stroke="#FF8500" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Corona Sun / Radiant Crest Symbol -->
  <g transform="translate(32,32)">
    <circle r="14" fill="url(#coronaGrad)" filter="url(#coronaGlow)"/>
    <circle r="9" fill="#141721"/>
    <!-- Corona Crown Spikes -->
    <path d="M0 -22 L3 -16 L-3 -16 Z" fill="#FFA32B"/>
    <path d="M15.5 -15.5 L14 -9 L10 -13 Z" fill="#FF8D12"/>
    <path d="M22 0 L16 3 L16 -3 Z" fill="#FF7800"/>
    <path d="M15.5 15.5 L9 14 L13 10 Z" fill="#FF6500"/>
    <path d="M0 22 L-3 16 L3 16 Z" fill="#E84F00"/>
    <path d="M-15.5 15.5 L-14 9 L-10 13 Z" fill="#FF7800"/>
    <path d="M-22 0 L-16 -3 L-16 3 Z" fill="#FF8D12"/>
    <path d="M-15.5 -15.5 L-9 -14 L-13 -10 Z" fill="#FFA32B"/>
    <!-- Stylized Central C for Corona -->
    <path d="M4 -5 C-3 -5 -6 -2 -6 2 C-6 6 -3 9 4 9 C6 9 7.5 8 8 7" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
